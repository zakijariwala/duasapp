<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Raaz" />
  <meta name="description" content="Supplications, Surahs & Ziyarat — Raaz-o-Neyaz" />

  <title>Raaz-o-Neyaz</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Top bar -->
  <header id="topbar">
    <button id="back-btn" class="back-btn" aria-label="Go back">‹</button>
    <span class="logo">Raaz-o-Neyaz</span>
    <span id="topbar-title" class="bar-title" style="display:none"></span>
    <button id="settings-toggle" aria-label="Settings">⚙️</button>
  </header>

  <!-- Settings modal -->
  <div id="settings-overlay" class="settings-overlay" style="display:none"></div>
  <div id="settings-modal" class="settings-modal" style="display:none">
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button id="settings-close" class="settings-close" aria-label="Close settings">✕</button>
    </div>

    <div class="settings-section">
      <div class="settings-label">Languages</div>
      <label class="settings-check">
        <input type="checkbox" id="lang-en" checked />
        <span class="checkmark"></span>
        <span>English</span>
      </label>
      <label class="settings-check">
        <input type="checkbox" id="lang-rurdu" checked />
        <span class="checkmark"></span>
        <span>Roman Urdu</span>
      </label>
      <label class="settings-check">
        <input type="checkbox" id="lang-urdu" checked />
        <span class="checkmark"></span>
        <span>اردو (Urdu)</span>
      </label>
    </div>

    <div class="settings-section">
      <div class="settings-label">Arabic Font Size</div>
      <div class="slider-row">
        <span class="slider-val" id="arabic-size-val">1.75</span>
        <input type="range" id="arabic-size-slider" min="1" max="3.5" step="0.05" value="1.75" />
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">Translation Font Size</div>
      <div class="slider-row">
        <span class="slider-val" id="trans-size-val">0.9</span>
        <input type="range" id="trans-size-slider" min="0.6" max="1.8" step="0.05" value="0.9" />
      </div>
    </div>
  </div>

  <!-- Global search bar (shown on all views except reader) -->
  <div id="global-search-bar" class="global-search-bar">
    <span class="global-search-icon">🔍</span>
    <input type="search" id="global-search-input" placeholder="Search duas, surahs…" autocomplete="off" />
    <button id="global-search-clear" class="search-clear-btn global-search-clear" aria-label="Clear search">✕</button>
    <button id="global-search-dismiss" class="search-dismiss-btn" aria-label="Dismiss search">Done</button>
    <label class="deep-search-toggle" title="Search inside all dua content">
      <input type="checkbox" id="deep-search-check" />
      <span class="deep-checkmark"></span>
      <span class="deep-label">Deep</span>
    </label>
  </div>

  <!-- Main content area -->
  <main id="content" role="main"></main>

  <!-- Bottom navigation -->
  <nav id="bottom-nav" aria-label="Main navigation">
    <button class="nav-btn active" data-tab="home" aria-label="Home">
      <span class="icon">🏠</span>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-tab="search" aria-label="Search">
      <span class="icon">🔍</span>
      <span>Search</span>
    </button>
    <button class="nav-btn" data-tab="bookmarks" aria-label="Bookmarks">
      <span class="icon">⭐</span>
      <span>Saved</span>
    </button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
