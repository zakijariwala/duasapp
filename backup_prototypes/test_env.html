<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raaz Test Loader</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #e6edf3; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .ar { font-size: 1.8rem; text-align: right; color: #c9a96e; margin-bottom: 10px; }
        .ro { font-style: italic; color: #8b949e; margin-bottom: 5px; }
        .en { color: #e6edf3; line-height: 1.6; }
        #dua-title { color: #c9a96e; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .error { color: #da3633; background: rgba(218, 54, 51, 0.1); padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1 id="dua-title">Loading...</h1>
    <div id="container"></div>

    <script>
        const duaId = '1074'; 
        async function loadDua() {
            const container = document.getElementById('container');
            const titleHeader = document.getElementById('dua-title');
            
            try {
                // Try relative path from root
                const url = `./duas_data/lines/${duaId}.json`;
                console.log("Attempting fetch from:", url);
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: Failed to fetch ${url}. Ensure the file exists and the server is running at the project root.`);
                }
                
                const data = await response.json();
                titleHeader.innerText = data.title.en;
                
                data.lines.forEach(l => {
                    if (l.type === 'image') return; // Skip image lines for simple test
                    
                    const div = document.createElement('div');
                    div.className = 'card';
                    
                    const arabic = l.arabic ? l.arabic.map(a => a.text).join(' ') : '';
                    const roman = l.rarabic || '';
                    const english = l.trans?.en || l.desc?.en || '';
                    
                    div.innerHTML = `
                        ${arabic ? `<div class="ar">${arabic}</div>` : ''}
                        ${roman ? `<div class="ro">${roman}</div>` : ''}
                        ${english ? `<div class="en">${english}</div>` : ''}
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                titleHeader.innerText = "Fetch Error";
                container.innerHTML = `<div class="error">
                    <p><strong>Message:</strong> ${err.message}</p>
                    <p><strong>Troubleshooting:</strong></p>
                    <ul>
                        <li>Run <code>python -m http.server 8000</code> in the project root.</li>
                        <li>Verify <code>D:/Zaki/Projects/PWA2/duas_data/lines/1074.json</code> exists.</li>
                        <li>Check Browser Console (F12) for CORS or 404 errors.</li>
                    </ul>
                </div>`;
                console.error("Test Environment Error:", err);
            }
        }
        loadDua();
    </script>
</body>
</html>
